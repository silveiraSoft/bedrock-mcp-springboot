openapi: 3.0.3
info:
  title: bedrock-mcp-springboot
  version: 0.1.0
  description: >
    Natural-language gateway and sample business API. Used as the contract for API Gateway (Terraform import)
    and, in phase 2, as an Amazon Bedrock AgentCore Gateway OpenAPI target.
servers:
  - url: https://api.example.com
security:
  - cognito: []
paths:
  /api/v1/chat:
    post:
      operationId: chat
      summary: Ask in natural language; the assistant uses tools over the REST API.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatRequest' }
      responses:
        '200':
          description: Answer (may be a guardrail-blocked message)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatResponse' }
        '400': { description: Validation error }
        '401': { description: Missing/invalid JWT }
        '502': { description: AI service unavailable }
  /api/v1/products:
    get:
      operationId: searchProducts
      summary: Search the product catalog
      parameters:
        - { name: query, in: query, required: false, schema: { type: string } }
        - { name: category, in: query, required: false, schema: { type: string, enum: [footwear, apparel, camping] } }
      responses:
        '200':
          description: Products (max 20)
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Product' } }
  /api/v1/products/{id}:
    get:
      operationId: getProduct
      summary: Get one product
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^P-\d{1,6}$' } }
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Product' }
        '404': { description: Not found }
  /api/v1/orders:
    post:
      operationId: createOrder
      summary: Create an order (side effect)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '422': { description: Business rule violated (e.g. insufficient stock) }
components:
  securitySchemes:
    cognito:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ChatRequest:
      type: object
      required: [message]
      properties:
        conversationId: { type: string, pattern: '^[A-Za-z0-9-]{1,64}$' }
        message: { type: string, maxLength: 4000 }
    ChatResponse:
      type: object
      properties:
        conversationId: { type: string }
        answer: { type: string }
        guardrail:
          type: object
          properties:
            input: { type: string, enum: [NONE, MASKED, BLOCKED] }
            output: { type: string, enum: [NONE, MASKED, BLOCKED] }
            reasons: { type: array, items: { type: string } }
        usage:
          type: object
          properties:
            inputTokens: { type: integer }
            outputTokens: { type: integer }
            totalTokens: { type: integer }
            model: { type: string }
    Product:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        category: { type: string }
        price: { type: number }
        currency: { type: string }
        stock: { type: integer }
    CreateOrderRequest:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: string }
        quantity: { type: integer, minimum: 1, maximum: 10 }
    Order:
      type: object
      properties:
        orderId: { type: string }
        productId: { type: string }
        quantity: { type: integer }
        total: { type: number }
        currency: { type: string }
        status: { type: string }
        createdAt: { type: string, format: date-time }

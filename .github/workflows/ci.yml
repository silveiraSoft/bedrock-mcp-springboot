# Minimal CI starting point (build + test + image build). Deployment (OIDC -> ECR -> ECS) comes with the infrastructure milestone.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify
        run: ./mvnw -B verify
      - name: Docker build (bedrock-mcp-springboot:<version>)
        run: |
          VERSION=$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout)
          docker build --build-arg APP_VERSION="$VERSION" -t "bedrock-mcp-springboot:$VERSION" .
